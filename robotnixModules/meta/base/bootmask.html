<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <style>
        .container {
            width: 1080px;
            height: 2400px;
            background-color: black;
            position: fixed;

            /* Chrome screenshot otherwise off by one :/ */
            padding-bottom: 1px;
        }

        .mask {
            /* High brightness filter is basically a mask right */
            filter: brightness(999)
                /* Stole green filter from https://stackoverflow.com/a/53336754 :( */
                invert(42%) sepia(93%) saturate(1352%) hue-rotate(87deg) brightness(119%) contrast(119%);;
        }
        
        .title {
            position: absolute;
            top: 60%;
            left: 50%;
            transform: translateX(-50%);
            width: 70%;
        }

        .logo {
            position: absolute;
            top: 45%;
            left: 50%;
            transform: translateX(-50%) translateY(-50%);
            width: 60%;
        }

        .powered-by {
            position: absolute;
            bottom: -2%;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            filter: invert();
        }
        
        button {
            position: absolute;
            bottom: 30px;
        }

        h1 {
            color: yellow;
            text-align: center;
            font-size: 40px;
            bottom: -0.1em;
            position: absolute;
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>UNAPPROVED TESTING FIRMWARE</h1>
        <img class="mask logo" src="https://upload.wikimedia.org/wikipedia/commons/1/19/GrapheneOS_Logo.svg">
        <img class="title" src="https://sophiah.gay/assets/Sophia%20Logo%20-%20Inverted-C_bvJ8PJ.svg">
        <img class="powered-by" src="https://b.catgirlsare.sexy/Ae9LMckkXjDD.png">
    </div>
</body>
</html>
